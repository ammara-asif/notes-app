<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="top">
    <h1 class="wordmark">QuickNotes</h1>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to dark theme">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main>
    <form id="composer" class="composer slip" data-color="default" autocomplete="off">
      <input id="c-title" class="c-title" name="title" placeholder="Title" aria-label="Title" maxlength="200">
      <textarea id="c-text" class="c-text" name="text" placeholder="Add a note…" aria-label="Note" rows="1"></textarea>
      <div class="c-bar">
        <div class="swatches" role="radiogroup" aria-label="Note color"></div>
        <div class="c-actions">
          <button type="button" id="c-cancel" class="text-btn">Close</button>
          <button type="submit" class="primary-btn">Save note</button>
        </div>
      </div>
      <p id="c-error" class="error" role="alert"></p>
    </form>

    <section id="pinned-section" class="group" hidden>
      <h2>Pinned</h2>
      <div id="pinned" class="grid"></div>
    </section>

    <section id="others-section" class="group">
      <h2 id="others-heading" hidden>Others</h2>
      <div id="others" class="grid"></div>
      <p id="empty" class="empty" hidden>No notes yet. Write your first one above.</p>
    </section>
  </main>

  <footer class="foot">
    <span id="version">v…</span>
  </footer>

  <dialog id="editor" class="editor slip" data-color="default">
    <form method="dialog" id="editor-form">
      <input id="e-title" class="c-title" placeholder="Title" aria-label="Title" maxlength="200">
      <textarea id="e-text" class="c-text" placeholder="Note" aria-label="Note" rows="6"></textarea>
      <div class="c-bar">
        <div class="swatches" role="radiogroup" aria-label="Note color"></div>
        <div class="c-actions">
          <button type="button" id="e-delete" class="text-btn danger">Delete</button>
          <button type="button" id="e-cancel" class="text-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save changes</button>
        </div>
      </div>
      <p id="e-error" class="error" role="alert"></p>
    </form>
  </dialog>

  <template id="note-tpl">
    <article class="note slip" tabindex="0">
      <h3 class="n-title"></h3>
      <p class="n-text"></p>
      <div class="n-meta">
        <span class="status"><span class="dot"></span><span class="status-label"></span></span>
        <time class="n-time"></time>
        <div class="n-actions">
          <button type="button" class="icon-btn pin" aria-label="Pin note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4-1-6ZM12 13v8"/></svg>
          </button>
          <button type="button" class="icon-btn del" aria-label="Delete note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
        </div>
      </div>
    </article>
  </template>

  <div id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
