server {
    listen 80;

    # Serve the static UI files.
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: anything under /api/ is forwarded to the API container.
    # "api" is the service name in docker-compose; Docker's internal DNS resolves it.
    # Browser and API share one origin (localhost:8080), so no CORS is needed.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
