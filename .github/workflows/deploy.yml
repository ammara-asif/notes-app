name: Deploy Notes App

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd api
          pytest tests/test_api.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Zip and upload to S3
        run: |
          zip -r build-${{ github.run_number }}.zip . \
            --exclude "*.git*" --exclude "*__pycache__*" --exclude "*.env*"
          aws s3 cp build-${{ github.run_number }}.zip s3://${{ secrets.S3_BUCKET }}/build-${{ github.run_number }}.zip
          aws s3 cp build-${{ github.run_number }}.zip s3://${{ secrets.S3_BUCKET }}/latest.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws s3 cp s3://${{ secrets.S3_BUCKET }}/latest.zip ~/app/latest.zip
            cd ~/app
            unzip -o latest.zip
            export APP_VERSION=${{ github.run_number }} GIT_SHA=${{ github.sha }}
            docker compose up --build -d

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check site is live
        run: |
          sleep 15
          curl --fail http://${{ secrets.EC2_HOST }}:8080 || exit 1
          curl --fail http://${{ secrets.EC2_HOST }}:8080/api/health || exit 1

      - name: Check the new build is the one running
        run: |
          live=$(curl --fail -s http://${{ secrets.EC2_HOST }}:8080/api/version)
          echo "Live version: $live"
          echo "$live" | grep -q '"version":"${{ github.run_number }}"' || {
            echo "Expected build ${{ github.run_number }} to be live"; exit 1; }