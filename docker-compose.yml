# One command (`docker compose up --build`) starts the whole system.
# Services on the same compose network reach each other by service name
# (e.g. the API connects to host "db" and "redis").

services:
  frontend:            # Presentation tier: nginx serves the UI and proxies /api
    build: ./frontend
    ports:
      - "8080:80"      # host:container -> open http://localhost:8080
    depends_on:
      - api

  api:                 # Application tier: FastAPI (not exposed to the host; only nginx talks to it)
    build: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:              # Async processing: consumes jobs from Redis
    build: ./worker
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:                  # Data tier: Postgres
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 10

  redis:               # The queue between API and worker
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
